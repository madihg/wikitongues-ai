[project]
name = "igala-speech"
version = "0.1.0"
description = "Scoring and, later, GPU jobs for the Wikitongues Igala speech programme"
requires-python = ">=3.11,<3.13"
dependencies = ["jiwer>=3.0", "pydantic>=2", "httpx>=0.27", "numpy>=1.26", "soundfile>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["igala_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
